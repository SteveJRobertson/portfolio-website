name: Update visual baselines

# After an intended visual change: retakes the Playwright screenshots in the same
# image CI compares them in, and commits them to the branch. Run it by hand on a
# branch, or put "[update baselines]" in a commit message pushed to one.
on:
  workflow_dispatch:
  push:
    branches-ignore: ['main']

permissions:
  contents: write

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[update baselines]')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Retake screenshots
        run: npx playwright test e2e/visual.spec.ts --update-snapshots

      - name: Commit baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/__screenshots__
          if git diff --cached --quiet; then
            echo 'Baselines unchanged'
          else
            git commit -m 'test: update visual baselines'
            git push
          fi
