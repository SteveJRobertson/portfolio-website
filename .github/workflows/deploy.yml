name: Deploy Teletext Portfolio to GitHub Pages

# Deploys main once CI has passed on it, or by hand.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Only a CI run for a push to main, and only when it passed
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Set the repository variable CUSTOM_DOMAIN (e.g. steverobertson.dev) to
      # serve the site from the root of that domain; unset, it stays on
      # stevejrobertson.github.io/portfolio-website/.
      - name: Work out where the site is served from
        id: site
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
            echo "url=https://$CUSTOM_DOMAIN" >> "$GITHUB_OUTPUT"
          else
            echo "base=/portfolio-website/" >> "$GITHUB_OUTPUT"
            echo "url=https://stevejrobertson.github.io" >> "$GITHUB_OUTPUT"
          fi

      # Set the repository variable UMAMI_WEBSITE_ID to the site's website ID from
      # Umami Cloud to count visits; unset, the site loads no analytics
      # (docs/seo-analytics/ANALYTICS.md).
      - name: Build and pre-render the site
        env:
          GITHUB_PAGES: 'true'
          BASE_PATH: ${{ steps.site.outputs.base }}
          SITE_URL: ${{ steps.site.outputs.url }}
          VITE_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
        run: npm run build

      - name: Build Storybook into /storybook
        env:
          GITHUB_PAGES: 'true'
          BASE_PATH: ${{ steps.site.outputs.base }}
        run: npm run build-storybook -- -o dist/storybook

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
