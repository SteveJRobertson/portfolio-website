<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- page-meta: replaced per page by scripts/prerender.ts -->
    <title>Steve Robertson | Teletext Portfolio</title>
    <meta name="description" content="Steve Robertson's developer portfolio presented as an authentic 1980s Ceefax/Teletext terminal system with 3-digit page navigation." />
    <!-- /page-meta -->
    <meta name="theme-color" content="#000000" />
    <link rel="preload" href="/fonts/bedstead.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The pre-rendered page in #root is for visitors without JavaScript; with it, the app replaces it -->
    <script>document.documentElement.classList.add('js')</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
